<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141a">
<title>TRU NAV</title>
<style>
:root{--bg:#10141a;--ink:#e6eef6;--dim:#9aabbc;--line:#243040;--sky:#8eb7d6;--card:#18202a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--sky)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c1016;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--sky);color:#10141a;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--sky);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>NAV</span></h1><p class="sub">Direction plus distance. Declination is on the map, not in this file.</p></header>
<div class="bar"><input id="q" placeholder="bearing, back, pace, 40…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Azimuth",d:"A direction is a number around the circle. Degrees run 0 to 360. North is 0, east 90, south 180, west 270. Mils on a military compass run 0 to 6400. This ship will not convert a degree into a mil for you unless you ask with a number."},
{t:"Back azimuth",d:"The way home is the heading plus or minus 180. Under 180, add 180. 180 or over, subtract 180. Walk 40 out, walk 220 back, if nothing pushed you off the line."},
{t:"Declination",d:"The needle points magnetic north. The map's north is true, or grid. The angle between them is declination, and it changes by place and year. Read it off the map legend. This ship will not guess Mobile's number."},
{t:"Dead reckoning",d:"A leg is a direction and a distance. Write the heading, count the paces, then the next leg. If you skip the count, you have a direction and a story."},
{t:"Pace",d:"A pace is two steps, left foot to left foot. Count yours on a known 100 meters. Uphill, brush, and a load shorten it. TRU Mark holds the same rule. Do not borrow someone else's count."},
{t:"Aiming off",d:"A stream or a road is a catch line. Aim to one side of the point you want, on purpose, so when you hit the line you know which way to turn. Straight at a point, and a small error puts you on the wrong side with no clue."},
{t:"Resection",d:"Two known points you can see. Take a bearing to each. The back bearing from each point, drawn on the map, crosses near where you stand. One bearing is a line. Two bearings are a fix. This ship has no map to draw on."},
{t:"North without a compass",d:"Day: shadow stick on TRU Mark. Night: Polaris on TRU Sky. This ship does not repeat those cards."},
{t:"Gap",d:"No GPS procedure, no grid-to-magnetic worksheet, no packed declination. If the legend is gone, say so and use a catch line."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(k,t,d){return `<article class="card"><div class="k">${esc(k)}</div><div class="big">${esc(t)}</div><div>${esc(d)}</div><div class="src">Standard land navigation. Declination and pace are measured.</div></article>`;}
function back(n){n=((n%360)+360)%360; return n<180?n+180:n-180;}
function show(html){document.getElementById("out").innerHTML=html;}
function search(q){
  q=(q||"").trim().toLowerCase();
  if(!q){show(C.map(x=>card("NAV",x.t,x.d)).join(""));return;}
  const n=parseFloat(q);
  if(!isNaN(n) && /^[0-9.]+$/.test(q)){
    show(card("BACK",n+" out",back(n)+" back. Add 180 if the heading is under 180. Subtract 180 if it is 180 or over."));
    return;
  }
  const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q));
  show(h.length?h.map(x=>card("NAV",x.t,x.d)).join(""):card("GAP","Not packed","No invented declination."));
}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
search("");
</script>
</body>
</html>
